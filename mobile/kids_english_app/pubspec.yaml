name: kids_english_app
description: Kids English learning app for Arabic-speaking children aged 3-12 (Little Learners track).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

# All dependencies are MIT / BSD-3 / Apache-2.0 (see /docs/licenses.md). No AI, ads, analytics or cloud SDKs.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  record: ^7.1.1
  path_provider: ^2.1.6
  http: ^1.5.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Asset folders are registered by `dotnet run --project tools/AssetGenerator -- export --track little-learners`
  # (Flutter does not include sub-folders of a listed folder, so every leaf folder is listed).
