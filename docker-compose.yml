# Local dev only. Copy .env.example to .env and fill in values; .env is git-ignored.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express   # free edition
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]

  api:
    build:
      context: .
      dockerfile: src/KidsEnglish.Api/Dockerfile
    depends_on: [sqlserver]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=KidsEnglish;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY (>=32 chars) in .env}
    ports: ["8080:8080"]

volumes:
  sqldata:
