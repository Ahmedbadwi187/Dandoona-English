# Printable cards for parents (one page per unit): things to look for and do at home, in English and Arabic.
# `node`-free: AssetGenerator `cards` turns this file, the unit titles and the unit words into cards/little_learners/*.html.
# Rules: short, kind, no pressure, nothing that needs a screen, nothing that needs buying.
letters:
  en:
    - "Point at a letter on a shop sign, a cereal box or a book cover and say its sound together."
    - "Look for the first letter of your child's name wherever you go."
    - "Say a word slowly (c-a-t) and ask which sound comes first."
    - "Write a big capital letter and the small one next to it on paper and trace them with a finger."
  ar:
    - "أشيروا إلى حرف على لافتة أو علبة أو غلاف كتاب وانطقوا صوته معًا."
    - "ابحثوا عن الحرف الأول من اسم طفلكم أينما ذهبتم."
    - "انطقوا كلمة ببطء (c-a-t) واسألوا: ما الصوت الذي يأتي أولًا؟"
    - "اكتبوا حرفًا كبيرًا والحرف الصغير بجانبه على ورقة واتبعاه بالإصبع."
colors:
  en:
    - "Name the colors of the clothes while getting dressed: a red shirt, blue socks."
    - "Play I spy with colors: I see something yellow."
    - "Sort toys or fruit by color into two boxes."
    - "Mix two paints or two colors of play dough and say what you get."
  ar:
    - "سمّوا ألوان الملابس أثناء ارتدائها: قميص أحمر، جوارب زرقاء."
    - "العبوا لعبة أرى شيئًا لونه أصفر."
    - "رتبوا الألعاب أو الفواكه حسب اللون في صندوقين."
    - "اخلطوا لونين من الطلاء أو الصلصال وقولوا ما اللون الجديد."
numbers:
  en:
    - "Count steps on the stairs, spoons on the table, or grapes on a plate, touching each one."
    - "Hold up fingers and ask: how many? Let your child show you too."
    - "Find the number on a door, a clock or a bus."
    - "Hide three, then four small things and let your child count them when found."
  ar:
    - "عدّوا درجات السلم أو الملاعق على المائدة أو حبات العنب، مع لمس كل واحدة."
    - "ارفعوا أصابعكم واسألوا: كم؟ ودعوا طفلكم يريكم أيضًا."
    - "ابحثوا عن رقم على باب أو ساعة أو حافلة."
    - "أخفوا ثلاثة ثم أربعة أشياء صغيرة ودعوا طفلكم يعدّها عند إيجادها."
shapes:
  en:
    - "Go on a shape walk: a round clock, a square window, a triangle roof."
    - "Cut a sandwich into triangles or rectangles and name them."
    - "Draw a house together using a square, a triangle and a circle."
    - "Ask: which shape is the plate? The door? The ball?"
  ar:
    - "قوموا بنزهة أشكال: ساعة دائرية، نافذة مربعة، سقف مثلث."
    - "قطعوا الساندويتش إلى مثلثات أو مستطيلات وسمّوها."
    - "ارسموا بيتًا معًا بمربع ومثلث ودائرة."
    - "اسألوا: ما شكل الطبق؟ والباب؟ والكرة؟"
animals:
  en:
    - "Make animal sounds together and guess which animal it is."
    - "Look for animals in picture books, on the street, or in the park and say their names."
    - "Ask where each animal lives: the cow on the farm, the fish in the water."
    - "Pretend to be an animal and let your child guess."
  ar:
    - "قلّدوا أصوات الحيوانات معًا وخمّنوا أي حيوان هو."
    - "ابحثوا عن الحيوانات في كتب الصور أو الشارع أو الحديقة وسمّوها."
    - "اسألوا أين يعيش كل حيوان: البقرة في المزرعة والسمكة في الماء."
    - "تظاهروا بأنكم حيوان ودعوا طفلكم يخمّن."
feelings:
  en:
    - "Name feelings as they happen: you look happy, you look sleepy."
    - "Make faces in the mirror: happy, sad, surprised, and guess them."
    - "When a story character is sad or scared, pause and ask how they feel."
    - "Say that all feelings are fine, and show one calm thing to do when angry."
  ar:
    - "سمّوا المشاعر وقت حدوثها: تبدو سعيدًا، تبدو نعسانًا."
    - "اصنعوا تعابير أمام المرآة: سعيد، حزين، متفاجئ، وخمّنوها."
    - "عندما تحزن أو تخاف شخصية في قصة، توقفوا واسألوا كيف تشعر."
    - "قولوا إن كل المشاعر مقبولة، وأروه شيئًا هادئًا يفعله عند الغضب."
my-body:
  en:
    - "Sing a touch-your-head song and name each part as you touch it."
    - "At bath time, name the parts you wash: hands, feet, ears."
    - "Play Simon says with body parts."
    - "Ask what we do with our eyes, ears, nose and mouth."
  ar:
    - "غنّوا أغنية المس رأسك وسمّوا كل جزء وأنتم تلمسونه."
    - "وقت الاستحمام سمّوا الأجزاء التي تغسلونها: اليدان والقدمان والأذنان."
    - "العبوا لعبة سيمون يقول بأجزاء الجسم."
    - "اسألوا: ماذا نفعل بالعينين والأذنين والأنف والفم؟"
actions:
  en:
    - "Play Dandoona says: jump, clap, sit, dance, with a stop-and-sleep at the end."
    - "Name what people do around you: he runs, she sits, the baby sleeps."
    - "Let your child give the orders and you do the actions."
    - "Dance to a song and call out the moves."
  ar:
    - "العبوا دندونة تقول: اقفز، صفّق، اجلس، ارقص، وفي النهاية توقف ونم."
    - "سمّوا ما يفعله الناس حولكم: هو يجري، هي تجلس، الطفل ينام."
    - "دعوا طفلكم يعطي الأوامر وأنتم تنفذون."
    - "ارقصوا على أغنية وسمّوا الحركات."
food:
  en:
    - "Name the food on the plate at every meal: an apple, milk, an egg."
    - "Let your child choose between two foods and say the name when choosing."
    - "Shop together: find a banana, a carrot, grapes."
    - "Sort the groceries: fruit, drinks, treats."
  ar:
    - "سمّوا الطعام في الطبق في كل وجبة: تفاحة، حليب، بيضة."
    - "دعوا طفلكم يختار بين طعامين ويقول اسم ما اختاره."
    - "تسوقوا معًا: ابحثوا عن موزة وجزرة وعنب."
    - "رتبوا المشتريات: فواكه ومشروبات وحلويات."
clothes:
  en:
    - "Name each piece of clothing while getting dressed: shirt, socks, shoes."
    - "Look out of the window and decide together: sunny or cold? What do we wear?"
    - "Let your child hand you the clothes you name."
    - "Sort the laundry into piles by what we wear in the sun and in the cold."
  ar:
    - "سمّوا كل قطعة ملابس أثناء ارتدائها: قميص، جوارب، حذاء."
    - "انظروا من النافذة وقرروا معًا: مشمس أم بارد؟ ماذا نرتدي؟"
    - "دعوا طفلكم يناولكم قطعة الملابس التي تسمونها."
    - "رتبوا الغسيل في أكوام حسب ما نرتديه في الشمس وفي البرد."
toys:
  en:
    - "Take turns with a toy and say my turn, your turn."
    - "Ask your child to bring a toy by name: bring me the ball."
    - "Tidy up together and name each toy as it goes in the box."
    - "Play with blocks and count how many you stack."
  ar:
    - "تناوبوا اللعب بلعبة وقولوا دوري، دورك."
    - "اطلبوا من طفلكم إحضار لعبة بالاسم: أحضر لي الكرة."
    - "رتبوا الألعاب معًا وسمّوا كل لعبة وهي تدخل الصندوق."
    - "العبوا بالمكعبات وعدّوا كم مكعبًا بنيتم."
my-family:
  en:
    - "Look at family photos and name everyone: mom, dad, grandma, brother."
    - "Ask: who is older? Who is the baby?"
    - "Call a grandparent and let your child say one English word to them."
    - "Draw your family together and name each person."
  ar:
    - "انظروا إلى صور العائلة وسمّوا الجميع: ماما، بابا، جدّتي، أخي."
    - "اسألوا: من الأكبر؟ ومن الصغير؟"
    - "اتصلوا بأحد الجدّين ودعوا طفلكم يقول له كلمة إنجليزية واحدة."
    - "ارسموا عائلتكم معًا وسمّوا كل شخص."
my-home:
  en:
    - "Walk through the house and name what you see: bed, door, lamp, table."
    - "Ask where things belong: the bed is in which room?"
    - "Play hide and seek with a key and say hot or cold."
    - "Let your child point at things you name from across the room."
  ar:
    - "تجولوا في البيت وسمّوا ما ترونه: سرير، باب، مصباح، طاولة."
    - "اسألوا أين مكان الأشياء: السرير في أي غرفة؟"
    - "العبوا الغميضة بمفتاح وقولوا ساخن أو بارد."
    - "دعوا طفلكم يشير إلى الأشياء التي تسمونها من آخر الغرفة."
opposites:
  en:
    - "Find opposites around you: big and small, hot and cold, up and down."
    - "Say one and let your child say the opposite."
    - "Walk fast then slow, up the stairs then down."
    - "Compare two things in the kitchen: which is bigger?"
  ar:
    - "ابحثوا عن الأضداد حولكم: كبير وصغير، ساخن وبارد، فوق وتحت."
    - "قولوا كلمة ودعوا طفلكم يقول ضدها."
    - "امشوا بسرعة ثم ببطء، إلى أعلى السلم ثم إلى أسفل."
    - "قارنوا بين شيئين في المطبخ: أيهما أكبر؟"
transport:
  en:
    - "Name the vehicles you see on the way: a bus, a car, a bike, a truck."
    - "Ask where each one goes: on the road, on the water, in the sky."
    - "Make the sounds together: beep beep, choo choo."
    - "Build a road with blocks and drive a toy car on it."
  ar:
    - "سمّوا المركبات التي تشاهدونها في الطريق: حافلة، سيارة، دراجة، شاحنة."
    - "اسألوا أين تسير كل واحدة: على الطريق أم في الماء أم في السماء."
    - "قلّدوا أصواتها معًا: بيب بيب، تشو تشو."
    - "ابنوا طريقًا بالمكعبات وقودوا عليه سيارة لعبة."
