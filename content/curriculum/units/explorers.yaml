# Units of the Explorers track (ages 6-8), in the order they open. Plan: docs/explorers-plan.md (sections 11 and 12).
# Letters is the Little Learners unit itself (`from: little-learners`): same lessons, files and progress, so a child of 6+ who does not
# know the letters starts there without moving to another track. Sound Builders is bundled; the later units will be content packs.
# A unit with no lessons yet shows "Soon" on the map.
track: explorers

# Where a child starts, from the parent's answer to "How much English does your child know?" (docs/explorers-plan.md, section 11).
placement:
  - { level: 0, key: none,         doneUnits: [],                       startUnit: letters }
  - { level: 1, key: some-letters, doneUnits: [],                       startUnit: letters }
  - { level: 2, key: all-letters,  doneUnits: [letters],                startUnit: sound-builders }
  - { level: 3, key: reads-words,  doneUnits: [letters, sound-builders], startUnit: digraphs }

# The phoneme table: one clip per sound, made by ElevenLabs from `say` (text-to-speech cannot read IPA reliably, so `say` is spelled
# for the voice: "kuh", "sss"). EVERY clip is flagged for the owner to listen to; a recording of your own placed next to the generated
# file (phoneme-<key>.override.mp3 in content/generated/explorers/phonemes/audio/) always wins. Keys are graphemes. A word part can
# borrow another key's sound ("ck:c", "a:ay" in cake) or be silent ("e:-", the magic e), so one clip serves every spelling of a sound.
# Short vowels first, then the consonants Sound Builders uses, then the sounds of Digraphs, Blends, Magic E and Vowel Teams.
phonemes:
  - { key: a, ipa: "/æ/", say: "aa" }
  - { key: e, ipa: "/ɛ/", say: "eh" }
  - { key: i, ipa: "/ɪ/", say: "ih" }
  - { key: o, ipa: "/ɒ/", say: "aw" }
  - { key: u, ipa: "/ʌ/", say: "uh" }
  - { key: b, ipa: "/b/", say: "buh" }
  - { key: c, ipa: "/k/", say: "kuh" }
  - { key: d, ipa: "/d/", say: "duh" }
  - { key: f, ipa: "/f/", say: "fff" }
  - { key: g, ipa: "/g/", say: "guh" }
  - { key: h, ipa: "/h/", say: "huh" }
  - { key: j, ipa: "/dʒ/", say: "juh" }
  - { key: m, ipa: "/m/", say: "mmm" }
  - { key: n, ipa: "/n/", say: "nnn" }
  - { key: p, ipa: "/p/", say: "puh" }
  - { key: s, ipa: "/s/", say: "sss" }
  - { key: t, ipa: "/t/", say: "tuh" }
  - { key: x, ipa: "/ks/", say: "ks" }
  - { key: l, ipa: "/l/", say: "lll" }
  - { key: r, ipa: "/r/", say: "rrr" }
  - { key: v, ipa: "/v/", say: "vvv" }
  - { key: z, ipa: "/z/", say: "zzz" }
  - { key: sh, ipa: "/ʃ/", say: "shh" }
  - { key: ch, ipa: "/tʃ/", say: "chuh" }
  - { key: th, ipa: "/θ/", say: "thh" }
  - { key: ay, ipa: "/eɪ/", say: "ay" }
  - { key: ee, ipa: "/iː/", say: "ee" }
  - { key: ie, ipa: "/aɪ/", say: "eye" }
  - { key: oa, ipa: "/oʊ/", say: "oh" }
  - { key: ue, ipa: "/juː/", say: "you" }
  - { key: oo, ipa: "/uː/", say: "oo" }
  - { key: ar, ipa: "/ɑːr/", say: "ar" }

# Review stops on the map: a quick game with the words of these units, after the last of them; passing it opens the next unit.
reviews:
  - { id: review-1, units: [sound-builders, digraphs, blends] }
  - { id: review-2, units: [magic-e, vowel-teams] }
  - { id: review-3, units: [sight-words-1, sight-words-2, my-sentences] }

units:
  - id: letters
    from: little-learners
    order: 1

  - id: sound-builders
    order: 2
    title: { en: "Sound Builders", ar: "تركيب الأصوات" }
    icon: sounds
    color: blue
    chest: { accessory: explorer-hat, stickers: [cat, pig, bus, cup] }
    # A tiny decodable story with the unit's words (short a, e, i, o, u), one sentence a page.
    story:
      pages:
        - { text: "The cat has a hat.", words: [cat, hat], pose: waving }
        - { text: "A hen naps on a bed.", words: [hen, bed], pose: thinking }
        - { text: "The pig has a big fig.", words: [pig, fig], pose: pointing-up }
        - { text: "The dog sits by the pot.", words: [dog, pot], pose: base }
        - { text: "A bug is in the cup! Fun!", words: [bug, cup], pose: jumping }
    narration:
      title: "Sound Builders"
      welcome: "Let's build words from sounds!"
      celebration: "You built so many words! Amazing!"
      lines: { locked: "Finish Sound Builders first!" }

  - id: digraphs
    order: 3
    delivery: pack
    title: { en: "Digraphs", ar: "الحروف المزدوجة" }
    icon: digraphs
    color: purple
    chest: { accessory: headphones, stickers: [fish, chick, duck, ship] }
    story:
      pages:
        - { text: "A fish is in a dish.", words: [fish, dish], pose: waving }
        - { text: "The chick has a chip.", words: [chick, chip], pose: thinking }
        - { text: "A moth sits on the bench.", words: [moth, bench], pose: pointing-up }
        - { text: "The duck has red socks.", words: [duck, socks], pose: base }
        - { text: "We run to the ship. Fun!", words: [ship], pose: jumping }
    narration: { title: "Digraphs", welcome: "Two letters, one sound!", celebration: "You know the digraphs! Super!", lines: { locked: "Finish Digraphs first!" } }

  - id: blends
    order: 4
    delivery: pack
    title: { en: "Blends", ar: "التجمعات" }
    icon: blends
    color: teal
    chest: { accessory: bandana, stickers: [frog, crab, drum, truck] }
    story:
      pages:
        - { text: "A frog is on a drum.", words: [frog, drum], pose: waving }
        - { text: "A crab has a flag.", words: [crab, flag], pose: thinking }
        - { text: "The truck has blocks.", words: [truck, blocks], pose: pointing-up }
        - { text: "A plum is in my hand.", words: [plum, hand], pose: base }
        - { text: "A gift! Clap, clap!", words: [gift, clap], pose: clapping }
    narration: { title: "Blends", welcome: "Let's blend sounds!", celebration: "You finished the blends! Great!", lines: { locked: "Finish Blends first!" } }

  - id: magic-e
    order: 5
    delivery: pack
    title: { en: "Magic E", ar: "الحرف الصامت" }
    icon: magic-e
    color: pink
    chest: { accessory: wizard-hat, stickers: [cake, kite, bike, rose] }
    story:
      pages:
        - { text: "A snake has a cake.", words: [snake, cake], pose: waving }
        - { text: "Five kites fly up!", words: [five, kite], pose: pointing-up }
        - { text: "I ride my bike to the plane.", words: [bike, plane], pose: thinking }
        - { text: "A rose is on my nose!", words: [rose, nose], pose: base }
        - { text: "The dog has a bone. Magic!", words: [bone], pose: jumping }
    narration: { title: "Magic E", welcome: "Let's find the magic e!", celebration: "Magic! You did it!", lines: { locked: "Finish Magic E first!" } }

  - id: vowel-teams
    order: 6
    delivery: pack
    title: { en: "Vowel Teams", ar: "اقتران الحروف" }
    icon: vowel-teams
    color: orange
    chest: { accessory: team-cap, stickers: [train, bee, goat, moon] }
    story:
      pages:
        - { text: "The rain is on the train.", words: [rain, train], pose: waving }
        - { text: "A snail is on the tree.", words: [snail, tree], pose: thinking }
        - { text: "A goat and a sheep in a boat!", words: [goat, sheep, boat], pose: pointing-up }
        - { text: "A bee sits on the toast.", words: [bee, toast], pose: base }
        - { text: "The moon and a star. Good night!", words: [moon, star], pose: waving }
    narration: { title: "Vowel Teams", welcome: "Vowels work as a team!", celebration: "Great teamwork!", lines: { locked: "Finish Vowel Teams first!" } }

  - id: sight-words-1
    order: 7
    delivery: pack
    title: { en: "Sight Words 1", ar: "كلمات شائعة ١" }
    icon: sight-words
    color: green
    chest: { accessory: book-hat, stickers: [cat, dog, bus, duck] }
    story:
      pages:
        - { text: "I see the cat.", words: [cat], pose: waving }
        - { text: "My dog is on the bed.", words: [dog, bed], pose: thinking }
        - { text: "The bug is in the cup.", words: [bug, cup], pose: pointing-up }
        - { text: "We can go on the bus.", words: [bus], pose: base }
        - { text: "A hen and a duck! Fun!", words: [hen, duck], pose: jumping }
    narration: { title: "Sight Words", welcome: "Let's learn words we see a lot!", celebration: "You know your sight words!", lines: { locked: "Finish Sight Words first!" } }

  - id: sight-words-2
    order: 8
    delivery: pack
    title: { en: "Sight Words 2", ar: "كلمات شائعة ٢" }
    icon: sight-words
    color: red
    chest: { accessory: detective-cap, stickers: [kite, fish, frog, goat] }
    story:
      pages:
        - { text: "Look at the kite!", words: [kite], pose: pointing-up }
        - { text: "Here is a fish.", words: [fish], pose: waving }
        - { text: "He was in the bath.", words: [bath], pose: thinking }
        - { text: "She has a cake.", words: [cake], pose: base }
        - { text: "They are bees! Buzz!", words: [bee], pose: jumping }
    narration: { title: "More Sight Words", welcome: "More words we see a lot!", celebration: "Wonderful reading!", lines: { locked: "Finish Sight Words first!" } }

  # Grammar comes early, inside the units, always through examples and pictures and never by its name: plurals with -s in
  # Sound Builders (Read & Pick: one cat, two cats), "a"/"an" whenever a word is read with its picture (a cat, an ant),
  # and is/are here in My Sentences (one picture: "The cat is big." / two: "The cats are big."). Grammar Starters reviews
  # and extends these patterns; it does not introduce them.
  - id: my-sentences
    order: 9
    delivery: pack
    title: { en: "My Sentences", ar: "جملي" }
    icon: sentences
    color: blue
    chest: { accessory: pencil-band, stickers: [cat, ant, egg, ship] }
    story:
      pages:
        - { text: "The cat is big.", words: [cat], pose: waving }
        - { text: "The pigs are pink.", words: [pig], pose: thinking }
        - { text: "I have an egg.", words: [egg], pose: base }
        - { text: "I see an ant.", words: [ant], pose: pointing-up }
        - { text: "The kites are up! Hooray!", words: [kite], pose: clapping }
    narration: { title: "My Sentences", welcome: "Let's read sentences!", celebration: "You can read sentences!", lines: { locked: "Finish My Sentences first!" } }

  - id: word-families
    order: 10
    delivery: pack
    title: { en: "Word Families", ar: "عائلات الكلمات" }
    icon: word-families
    color: purple
    narration: { title: "Word Families", welcome: "Words in a family sound alike!", celebration: "You know the word families!", lines: { locked: "Finish Word Families first!" } }

  - id: everyday-english
    order: 11
    delivery: pack
    title: { en: "Everyday English", ar: "مفردات الحياة" }
    icon: everyday
    color: teal
    narration: { title: "Everyday English", welcome: "Let's talk about our day!", celebration: "Great everyday English!", lines: { locked: "Finish Everyday English first!" } }

  - id: numbers-time
    order: 12
    delivery: pack
    title: { en: "Numbers & Time", ar: "الأرقام والوقت" }
    icon: clock
    color: orange
    narration: { title: "Numbers and Time", welcome: "What time is it?", celebration: "You can tell the time!", lines: { locked: "Finish Numbers and Time first!" } }

  # Reviews and extends what the earlier units showed (-s plurals, a/an, is/are) with new examples: no grammar terms.
  - id: grammar-starters
    order: 13
    delivery: pack
    title: { en: "Grammar Starters", ar: "بدايات القواعد" }
    icon: grammar
    color: green
    narration: { title: "Grammar Starters", welcome: "Let's put words together!", celebration: "You are a word expert!", lines: { locked: "Finish Grammar Starters first!" } }
