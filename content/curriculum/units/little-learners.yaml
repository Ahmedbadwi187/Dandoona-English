# Units of the Little Learners track, in the order they open (a unit opens when the previous one is finished).
# A unit with no lessons yet is shown on the map as "coming soon". To add lessons to a unit, add lesson files with
# `unit: <id>`; no code change is needed. `icon` is a picture key the app knows (unknown keys show a star); `color` is a palette.json name.
# `delivery`: Letters and Colors are bundled in the app (they work offline from the first launch). Every later unit is a
# downloadable content pack (`delivery: pack`): `export` writes it to packs/<track>/<unit>/v<version>/, our API serves it, and the
# app fetches it when the child is one unit away (see docs/content-packs.md). A unit's own lines (its name) are always bundled.
track: little-learners

# What each answer to "How much English does your child know?" means. The app reads this from the exported JSON, so changing where a
# child starts (for example when Numbers is ready) is a change here, not in code. "doneUnits" count as done by placement: they open the
# next unit but give no certificate.
placement:
  - { level: 0, key: none,         doneUnits: [],        startUnit: letters }
  - { level: 1, key: some-letters, doneUnits: [],        startUnit: letters }
  - { level: 2, key: all-letters,  doneUnits: [letters], startUnit: colors }
  - { level: 3, key: reads-words,  doneUnits: [letters], startUnit: colors }
# Dandoona's own lines outside any unit: "Who is playing?" (title), the first greeting (welcome) and a welcome back (celebration);
# `lines` are the map's short sayings (a line without audio yet is left out of the export, the bubble still shows the words).
app:
  title: "Who is playing?"
  welcome: "Hi! I'm Dandoona! Let's learn English together!"
  celebration: "Welcome back!"
  lines: { coming-soon: "Coming soon!", puzzle-first: "Play the puzzle first!", almost-ready: "Almost ready!" }

# Review stops on the map: a quick game with the words of these units, after the last of them; passing it opens the next unit.
# The castle at the end of the path is the final review of every unit, with the track certificate.
reviews:
  - { id: review-1, units: [letters, colors, numbers, shapes] }
  - { id: review-2, units: [animals, feelings, my-body, actions] }
  - { id: review-3, units: [food, clothes, toys] }

# The path, in order. Each unit is followed on the map by its story (when it has one) and its treasure chest.
# `lines.locked` is what Dandoona says when a child taps a closed stop while this unit is the one to finish.
units:
  - id: letters
    order: 1
    title: { en: "Letters", ar: "الحروف" }
    icon: letters
    color: red
    narration:
      title: "Letters"
      welcome: "Let's learn the letters!"
      celebration: "You finished the letters! Amazing!"
      lines: { locked: "Finish Letters first!" }
  - id: colors
    order: 2
    title: { en: "Colors", ar: "الألوان" }
    icon: colors
    color: orange
    narration:
      title: "Colors"
      welcome: "Let's learn the colors!"
      celebration: "You finished the colors! Wow!"
      lines: { locked: "Finish Colors first!" }
  - id: numbers
    order: 3
    delivery: pack
    title: { en: "Numbers 1-10", ar: "الأرقام ١-١٠" }
    icon: numbers
    color: blue
    narration:
      title: "Numbers"
      welcome: "Let's count!"
      celebration: "You finished the numbers! Great counting!"
      lines: { locked: "Finish Numbers first!" }
  - id: shapes
