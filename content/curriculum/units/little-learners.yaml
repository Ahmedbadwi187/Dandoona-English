        - { text: "She sees a red apple and a red strawberry.", words: [apple, strawberry], pose: pointing-up }
        - { text: "A yellow duck swims by a green frog.", words: [duck, frog], pose: jumping }
        - { text: "A blue balloon floats near a blue cloud.", words: [balloon, cloud], pose: thinking }
        - { text: "What a colorful day!", words: [], pose: clapping }
    narration:
