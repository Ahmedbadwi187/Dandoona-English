# Builds the iPhone/iPad app on a macOS machine in GitHub and uploads it to TestFlight. No Mac needed.
# Runs on every push to the `testflight` branch (no merge into main needed), or by hand: GitHub > Actions > "iOS TestFlight" >
# Run workflow (the button shows once this file is on main).
# Signing goes through the App Store Connect API: each run makes its own distribution certificate and App Store profile,
# signs with them, uploads, then revokes/deletes them (uploaded builds stay valid: Apple re-signs App Store/TestFlight builds).
# Needs these repository secrets (Settings > Secrets and variables > Actions); steps in docs/ios-testflight.md:
#   APPLE_TEAM_ID   the 10-character Team ID of the Apple Developer account
#   ASC_KEY_ID      App Store Connect API key id (a Team key with Admin access)
#   ASC_ISSUER_ID   App Store Connect API issuer id
#   ASC_KEY_P8      the whole text of the .p8 key file (from -----BEGIN PRIVATE KEY----- to the END line)
# Optional: API_BASE_URL (https://...) so the build can sync and download content packs; without it only the bundled
# units (Letters, Colors) are playable.
name: iOS TestFlight

on:
  push:
    branches: [testflight]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server address for this build (https://...). Empty = the API_BASE_URL secret, or no server."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.dandoona.kidsEnglishApp

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile/kids_english_app
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/ios-testflight.md)"; exit 1; fi

      - name: Write the App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey.p8"
          cp "$RUNNER_TEMP/keys/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_$(echo "$KEY_ID" | tr -d '[:space:]').p8"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography

      - name: Check the key, the Bundle ID and the app in App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: '"$RUNNER_TEMP/venv/bin/python" ios/ci/asc_signing.py check'

      - name: Use the newest Xcode 26 (App Store Connect needs the iOS 26 SDK or later)
        working-directory: .
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26 on this machine. Installed: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test (the same checks as before every commit)
        run: |
          flutter analyze
          flutter test

      - name: Make this run's certificate and App Store profile
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          OUT_DIR: ${{ runner.temp }}/signing
          RUN_NAME: ${{ github.run_number }}
        run: |
          P12_PASSWORD="$(openssl rand -hex 16)"; echo "::add-mask::$P12_PASSWORD"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"; echo "::add-mask::$KEYCHAIN_PASSWORD"
          export P12_PASSWORD
          "$RUNNER_TEMP/venv/bin/python" ios/ci/asc_signing.py create
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$OUT_DIR/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          UUID="$(grep '^profile_uuid=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$OUT_DIR/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done

      - name: Build and sign the app
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ steps.signing.outputs.profile_name }}
          API: ${{ inputs.api_base_url != '' && inputs.api_base_url || secrets.API_BASE_URL }}
        run: |
          TEAM="$(echo "$TEAM" | tr -d '[:space:]')"
          python3 ios/ci/manual_signing.py "$TEAM" "$PROFILE"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM" ios/ci/ExportOptions-manual.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE" ios/ci/ExportOptions-manual.plist
          args="--release --build-number=${{ github.run_number }} --export-options-plist=ios/ci/ExportOptions-manual.plist"
          if [ -n "$API" ]; then args="$args --dart-define=API_BASE_URL=$API"; echo "Server: set"; else echo "Server: none (Letters and Colors only)"; fi
          flutter build ipa $args
          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$(echo "$KEY_ID" | tr -d '[:space:]')" --apiIssuer "$(echo "$ISSUER" | tr -d '[:space:]')"
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect > TestFlight after Apple processes it (often 10-30 minutes)."

      - name: Revoke this run's certificate and profile, remove the key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          OUT_DIR: ${{ runner.temp }}/signing
        run: |
          if [ -f "$ASC_KEY_PATH" ] && [ -x "$RUNNER_TEMP/venv/bin/python" ]; then "$RUNNER_TEMP/venv/bin/python" ios/ci/asc_signing.py cleanup || true; fi
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing" "$HOME/.appstoreconnect"
